<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserva do Ipês — Mapa de Vendas</title>
<style>
  :root{--marrom:#7A4A16;--marrom2:#A86018;--amarelo:#EFB700;--amarelo2:#D8A818;--rosa:#D87890;--lilas:#9078A8;--cinza:#C9C9C9;--texto:#2A2118;--texto-suave:#6B5A45;--borda:#E7DCC7;--fundo:#FBF7EE;--branco:#fff;}
  *{box-sizing:border-box;} body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--fundo);color:var(--texto);}
  header{background:linear-gradient(135deg,var(--marrom),var(--marrom2));color:#fff;padding:16px 28px;display:flex;align-items:center;gap:18px;}
  header .logos{display:flex;align-items:center;gap:12px;} header .logos img{height:48px;background:#fff;border-radius:8px;padding:4px;}
  header h1{font-size:17px;font-weight:700;margin:0;} header span{font-size:12px;color:var(--amarelo);font-weight:600;}
  main{max-width:1280px;margin:24px auto 80px;padding:0 20px;}
  h2.sec{font-size:15px;color:var(--marrom);border-bottom:2px solid var(--amarelo);padding-bottom:8px;margin:0 0 16px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:32px;}
  .tcard{background:#fff;border:1px solid var(--borda);border-top:5px solid var(--amarelo);border-radius:12px;padding:22px 18px;cursor:pointer;text-align:center;transition:.15s;position:relative;overflow:hidden;}
  .tcard:hover{box-shadow:0 4px 14px rgba(122,74,22,.15);transform:translateY(-2px);}
  .tcard b{display:block;font-size:17px;color:var(--marrom);margin-bottom:2px;} .tcard small{color:var(--texto-suave);font-size:13px;}
  .tcard .preco{display:block;margin-top:6px;font-size:13px;font-weight:700;color:var(--marrom2);}
  .selo{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.5px;color:#fff;}
  /* set/26 — VENDIDA passou a ser VERMELHA (antes era quase preta e ficava
     igual a "em breve" no mapa). "Em breve" virou cinza e RESERVADA, azul. */
  .selo.breve{background:#8A8A8A;} .selo.vend{background:#C1121F;}
  .selo.res{background:#1F6FB2;} .selo.disp{background:#2E7D52;}
  .btn-sim{padding:7px 12px;border-radius:6px;border:none;background:var(--amarelo);color:var(--marrom);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;}
  .btn-sim:hover{background:var(--amarelo2);}
  /* Proposta ao lado de Simular na faixa de preço: quem já sabe o valor e a
     unidade não precisa passar pela simulação para propor. Cor diferente
     porque a ação é diferente — uma calcula, a outra compromete. */
  .btn-prop{padding:7px 12px;border-radius:6px;border:1px solid var(--marrom);background:var(--branco);color:var(--marrom);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;}
  .btn-prop:hover{background:var(--marrom);color:#fff;}
  .acoes{display:flex;gap:6px;justify-content:flex-end;}
  .vazio{padding:16px;font-size:13px;color:var(--texto-suave);}
  #modal .uns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .layout{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start;}
  @media(max-width:980px){.layout{grid-template-columns:1fr;}}
  .mapbox{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:12px;position:relative;}
  /* empilhado com a logo, no canto inferior direito: no alto à direita o
     botão cobria a unidade 31, e no inferior esquerdo ficava sobre a legenda */
  .zoom{position:absolute;bottom:74px;right:18px;display:flex;gap:6px;z-index:6;}
  .zoom button{box-shadow:0 2px 8px rgba(42,33,24,.18);}
  .marca-mapa{position:absolute;bottom:14px;right:18px;z-index:5;pointer-events:none;
    background:rgba(255,255,255,.88);border:1px solid var(--borda);border-radius:10px;
    padding:6px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(42,33,24,.12);}
  .marca-mapa img{height:40px;width:auto;display:block;}
  .marca-mapa span{font-size:11px;font-weight:700;color:var(--marrom);line-height:1.25;max-width:110px;}
  @media(max-width:640px){.marca-mapa img{height:30px;} .marca-mapa span{display:none;}}
  .zoom button{width:34px;height:34px;border-radius:6px;border:1px solid var(--borda);background:#fff;color:var(--marrom);font-size:18px;font-weight:700;cursor:pointer;}
  #mapScroll{overflow:auto;max-height:74vh;overscroll-behavior:contain;touch-action:pan-x pan-y pinch-zoom;-webkit-user-select:none;user-select:none;}
  #mapScroll svg{display:block;height:auto;}
  #mapScroll svg *{-webkit-user-drag:none;}
  #mapScroll polygon{stroke:var(--marrom2);stroke-width:3;cursor:pointer;transition:fill .1s;}
  #mapScroll polygon.sel{stroke:#2A2118;stroke-width:5;}
  .legenda{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--texto-suave);}
  .legenda span{display:flex;align-items:center;gap:6px;}
  .legenda i{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15);}
  .tabela{background:#fff;border:1px solid var(--borda);border-radius:10px;overflow:hidden;}
  .tabela table{width:100%;border-collapse:collapse;font-size:13px;}
  .tabela th{background:var(--marrom);color:#fff;text-align:left;padding:10px 12px;font-size:12px;}
  .tabela td{padding:9px 12px;border-top:1px solid var(--borda);}
  .tabela td .un{color:var(--texto-suave);font-size:12px;}
  .tabela .tot{text-align:center;font-weight:700;color:var(--marrom);}
  /* popup unidade */
  #pop{position:fixed;z-index:50;display:none;width:230px;background:#fff;border:1px solid var(--borda);border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.2);padding:14px;}
  #pop h4{margin:0 0 8px;color:var(--marrom);font-size:15px;}
  #pop .val{font-size:13px;margin:2px 0;} #pop .val b{color:var(--marrom);}
  #pop img{width:100%;border-radius:6px;margin:8px 0;border:1px solid var(--borda);}
  #pop .acoes{display:flex;gap:8px;margin-top:8px;}
  #pop button{flex:1;padding:8px;border-radius:6px;border:none;font-size:12px;font-weight:700;cursor:pointer;}
  #pop .b1{background:var(--amarelo);color:var(--marrom);} #pop .b2{background:#fff;color:var(--marrom);border:1px solid var(--borda);}
  #pop .x{position:absolute;top:6px;right:10px;cursor:pointer;color:var(--texto-suave);font-size:18px;}
  #pop .band{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:10px;display:none;}
  /* A faixa tinha o texto "EM BREVE!" preso no CSS, então unidade reservada
     ou vendida também saía como "em breve". O texto agora vem do estado. */
  #pop .band::before{content:attr(data-texto);position:absolute;top:50%;left:-10%;width:120%;text-align:center;transform:translateY(-50%) rotate(-22deg);background:#8A8A8A;color:#fff;font-weight:800;font-size:15px;letter-spacing:1px;padding:6px 0;box-shadow:0 2px 8px rgba(0,0,0,.35);}
  #pop .band.vend::before{background:#C1121F;}
  #pop .band.res::before{background:#1F6FB2;}
  #pop .acoes button:disabled{opacity:.45;cursor:not-allowed;}
  /* Véu de carregamento: o mapa aparece opaco até os dados de verdade
     chegarem, em vez de mostrar o retrato antigo e trocar na cara da pessoa. */
  #veu{position:fixed;inset:0;background:rgba(251,247,238,.92);z-index:60;display:flex;
       align-items:center;justify-content:center;flex-direction:column;gap:14px;
       transition:opacity .35s ease;}
  #veu.sumindo{opacity:0;pointer-events:none;}
  #veu .giro{width:42px;height:42px;border:4px solid #E7DCC7;border-top-color:var(--marrom);
             border-radius:50%;animation:girar .9s linear infinite;}
  @keyframes girar{to{transform:rotate(360deg);}}
  #veu span{font-size:14px;font-weight:700;color:var(--marrom);letter-spacing:.3px;}
  main{transition:opacity .35s ease;}
  main.carregando{opacity:.35;}
  #pop.indisponivel .band, #pop .band.res, #pop .band.vend{display:block;}
  #pop .band.vend::before{content:'VENDIDA';background:#2A2118;}
  /* modal tipo */
  #modal{position:fixed;inset:0;background:rgba(42,33,24,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
  #modal .box{background:#fff;border-radius:12px;max-width:920px;width:100%;max-height:92vh;overflow:auto;padding:26px;position:relative;}
  #modal h3{margin:0 0 4px;color:var(--marrom);} #modal .x{position:absolute;top:14px;right:18px;cursor:pointer;font-size:22px;color:var(--texto-suave);}
  #modal img{width:100%;border-radius:8px;border:1px solid var(--borda);margin-top:12px;}
  #modal .uns{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-top:16px;}
  #modal .un-chip{border:1px solid var(--borda);border-radius:8px;padding:10px 12px;font-size:12px;text-align:left;background:#fff;}
  #modal .un-chip b{display:block;color:var(--marrom);font-size:14px;margin-bottom:2px;}
  #modal .un-chip small{color:var(--texto-suave);line-height:1.5;}
  #modal .un-chip.ok{cursor:pointer;border-color:var(--amarelo);}
  #modal .un-chip.ok:hover{background:#FFFBF0;box-shadow:0 2px 10px rgba(122,74,22,.16);transform:translateY(-1px);}
  #modal .un-chip.ok .cta{display:block;margin-top:6px;color:var(--marrom2);font-weight:700;}
  #modal .un-chip.off{opacity:.5;}
</style>
</head>

<script>

  /* Paleta do empreendimento. O rosa #D87890 do Tipo 2 estava perto demais do
     vermelho de VENDIDA — no mapa, com a casa pequena, as duas se confundiam.
     O Tipo 2 foi para um verde-água, que não disputa com nada da legenda
     (amarelo, lilás, cinza, vermelho), e o vermelho de vendida ficou saturado
     de verdade (#C1121F). */
  /* Tipo 2 no verde-limão: o verde-água anterior brigava com o azul de
     RESERVADA. Limão sai da faixa do azul e da do vermelho de uma vez. */
  var PALETA=['#E8A33D','#A3C93A','#9078A8','#BFC4C9'];
  var DEC_COR='#7A4A16';
  var tiposOrdenados=[];
  function corDoTipo(t,decorado){
    if(decorado) return DEC_COR;
    var i=tiposOrdenados.indexOf(String(t)); if(i<0)i=0;
    return PALETA[i % PALETA.length];
  }
  function rgba(hex,a){var n=parseInt(hex.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}

  // Planta: usa assets/plantas/tipo-<TIPO>.jpg do repositório se existir;
  // se não existir, cai automaticamente para a imagem do Notion.
  function localPlanta(u){
    if(!u) return '';
    return 'assets/plantas/' + (u.decorado ? 'decorado' : ('tipo-' + String(u.tipo).trim())) + '.jpg';
  }
  function mostrarPlanta(img, u){
    if(!u){ img.style.display='none'; return; }
    // 1) o que veio do Notion/pipeline (já costuma ser assets/plantas/...),
    // 2) se falhar, o arquivo local por convenção, 3) some.
    var primeiro=u.planta||'', segundo=localPlanta(u);
    if(!primeiro && !segundo){ img.style.display='none'; return; }
    img.onerror=function(){
      img.onerror=null;
      if(segundo && img.getAttribute('src')!==segundo){ img.src=segundo; }
      else { img.style.display='none'; }
    };
    img.style.display='block';
    img.src = primeiro || segundo;
  }

  var UNIDADES=[];
  var FALLBACK=(function(){var a=[];for(var n=1;n<=62;n++)a.push({unidade:n,tipo:'1',valorVenda:305000,avaliacao:306000,planta:'',informacoes:(n===1?'Decorado':''),decorado:(n===1),disponivel:true});return a;})();
  function fmt(v){return 'R$ '+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function porNum(n){return UNIDADES.find(function(u){return String(u.unidade)===String(n);});}
  /* =====================================================================
     UM LUGAR SÓ DECIDE O ESTADO DA UNIDADE.
     Antes cada pedaço da tela reimplementava a regra à sua maneira — e foi
     por isso que a unidade RESERVADA ficava azul no mapa e "EM BREVE!" na
     faixa do pop-up ao mesmo tempo. Agora todo mundo pergunta a estadoUn().
     ===================================================================== */
  function estadoUn(u){
    if(!u) return 'BREVE';
    var cru=String(u.vendidaCru||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
    if(u.vendido===true || cru==='SIM') return 'VENDIDA';
    if(u.reservado===true || cru==='RESERVADA' || cru==='RESERVADO') return 'RESERVADA';
    if(u.disponivel===false) return 'BREVE';
    return 'DISPONIVEL';
  }
  var ROTULO_ESTADO={VENDIDA:'VENDIDA', RESERVADA:'RESERVADA', BREVE:'EM BREVE', DISPONIVEL:'Disponível'};
  function vendido(u){ return estadoUn(u)==='VENDIDA'; }
  function reservado(u){ return estadoUn(u)==='RESERVADA'; }
  function indisponivel(u){ return estadoUn(u)==='BREVE'; }
  function disponivelParaVenda(u){ return estadoUn(u)==='DISPONIVEL'; }

  // ---- cards por tipo (+ decorado) ----
  function renderCards(){
    tiposOrdenados=[...new Set(UNIDADES.filter(function(u){return !u.decorado;}).map(function(u){return String(u.tipo);}))];
    var html='';
    function selo(us){
      if(us.length && us.every(vendido)) return '<span class="selo vend">VENDIDO</span>';
      if(us.length && us.every(reservado)) return '<span class="selo res">RESERVADA</span>';
      if(!us.some(disponivelParaVenda)) return '<span class="selo breve">EM BREVE</span>';
      return '<span class="selo disp">'+us.filter(disponivelParaVenda).length+' disponível(is)</span>';
    }
    tiposOrdenados.forEach(function(t){
      var us=UNIDADES.filter(function(u){return String(u.tipo)===String(t)&&!u.decorado;});
      var precos=us.map(function(u){return u.valorVenda||0;}).filter(function(v){return v>0;});
      var minimo=precos.length?Math.min.apply(null,precos):0;
      html+='<div class="tcard" style="border-top-color:'+corDoTipo(t,false)+'" onclick="abrirTipo(\''+t+'\',false)">'+
            '<b>Tipo '+t+'</b><small>'+us.length+' unidade(s)</small>'+
            (minimo?'<span class="preco">a partir de '+fmt(minimo)+'</span>':'')+selo(us)+'</div>';
    });
    var dec=UNIDADES.find(function(u){return u.decorado;});
    if(dec) html+='<div class="tcard" style="border-top-color:'+DEC_COR+'" onclick="abrirTipo(\''+dec.tipo+'\',true)">'+
      '<b>Decorado</b><small>Unidade '+dec.unidade+'</small>'+
      (dec.valorVenda?'<span class="preco">'+fmt(dec.valorVenda)+'</span>':'')+selo([dec])+'</div>';
    document.getElementById('cards').innerHTML=html;
    var leg=tiposOrdenados.map(function(t){return '<span><i style="background:'+corDoTipo(t,false)+'"></i>Tipo '+t+'</span>';}).join('');
    if(dec) leg+='<span><i style="background:'+DEC_COR+'"></i>Decorado</span>';
    if(UNIDADES.some(indisponivel)) leg+='<span><i style="background:'+COR_INDISP+'"></i>Em breve</span>';
    if(UNIDADES.some(reservado)) leg+='<span><i style="background:'+COR_RESERVADA+'"></i>Reservada</span>';
    if(UNIDADES.some(vendido)) leg+='<span><i style="background:'+COR_VENDIDO+'"></i>Vendida</span>';
    var elLeg=document.getElementById('legenda'); if(elLeg) elLeg.innerHTML=leg;
  }
  function abrirTipo(t,decorado){
    var us = decorado ? UNIDADES.filter(function(x){return x.decorado;})
                      : UNIDADES.filter(function(x){return String(x.tipo)===String(t)&&!x.decorado;});
    var u=us[0]||{};
    document.getElementById('mTit').textContent = decorado?('Decorado — Tipo '+t):('Tipo '+t);
    document.getElementById('mInfo').textContent = (u.informacoes)||'';
    mostrarPlanta(document.getElementById('mImg'), u);
    // lista das unidades desse tipo
    document.getElementById('mUns').innerHTML = us.map(function(x){
      var livre = disponivelParaVenda(x);
      var est = vendido(x)?'Vendida':(reservado(x)?'Reservada':(indisponivel(x)?'Em breve':'Disponível'));
      var clique = livre ? ' onclick="simular(\''+x.tipo+'\',\''+x.unidade+'\')"' : '';
      return '<div class="un-chip'+(livre?' ok':' off')+'"'+clique+'><b>Un. '+x.unidade+'</b>'+
             '<small>'+(x.valorVenda?fmt(x.valorVenda):'—')+'<br>'+est+'</small>'+
             (livre?'<span class="cta">Simular →</span>':'')+'</div>';
    }).join('');
    document.getElementById('modal').style.display='flex';
  }
  function fecharModal(){document.getElementById('modal').style.display='none';}

  // ---- tabela por valor de venda ----
  function renderTabela(){
    var g={};
    UNIDADES.filter(disponivelParaVenda).forEach(function(u){
      var k=u.valorVenda||0; (g[k]=g[k]||[]).push(u);
    });
    var linhas=Object.keys(g).map(Number).sort(function(a,b){return a-b;});
    if(!linhas.length){
      document.getElementById('tbody').innerHTML='<tr><td colspan="3" class="vazio">Nenhuma unidade disponível no momento.</td></tr>';
      return;
    }
    document.getElementById('tbody').innerHTML=linhas.map(function(v){
      var us=g[v].slice().sort(function(a,b){return (parseInt(a.unidade,10)||0)-(parseInt(b.unidade,10)||0);});
      var nums=us.map(function(u){return u.unidade;});
      var p=us[0];
      return '<tr><td>'+fmt(v)+'<div class="un">Unid.: '+nums.join(', ')+'</div></td>'+
             '<td class="tot">'+us.length+'</td>'+
             '<td><div class="acoes">'+
               '<button class="btn-sim" onclick="simular(\''+p.tipo+'\',\''+p.unidade+'\')">Simular</button>'+
               '<button class="btn-prop" onclick="proposta(\''+p.tipo+'\',\''+p.unidade+'\')">Proposta</button>'+
             '</div></td></tr>';
    }).join('');
  }
  function simular(tipo,unidade){
    location.href='simulador.html?tipo='+encodeURIComponent(tipo)+'&unidade='+encodeURIComponent(unidade);
  }
  /* A proposta sai do mapa pelo mesmo caminho da simulação: mesma unidade,
     mesmos parâmetros na URL. A diferença é o destino — proposta.html grava
     na base PROPOSTAS e é lá que a unidade é de fato aceita ou reservada. */
  function proposta(tipo,unidade){
    location.href='proposta.html?tipo='+encodeURIComponent(tipo)+'&unidade='+encodeURIComponent(unidade);
  }

  // ---- cor das unidades por tipo (só cores; listeners ficam no ligarMapa) ----
  var COR_INDISP='#9AA0A6', COR_VENDIDO='#C1121F', COR_RESERVADA='#1F6FB2';
  function corUnidade(u){
    if(vendido(u)) return COR_VENDIDO;
    if(reservado(u)) return COR_RESERVADA;
    if(indisponivel(u)) return COR_INDISP;
    return corDoTipo(u.tipo,u.decorado);
  }
  function pintarMapa(){
    for(var n=1;n<=62;n++){
      var u=porNum(n), pol=document.getElementById(String(n).padStart(2,'0'));
      if(!u||!pol)continue;
      var cor=corUnidade(u);
      pol.dataset.base=rgba(cor,0.35); pol.dataset.hover=rgba(cor,0.7);
      if(pol!==selPoly) pol.style.fill=pol.dataset.base;
    }
  }

  // ---- popup unidade ----
  var selPoly=null;
  function abrirPop(u,evt){
    if(selPoly){selPoly.classList.remove('sel');selPoly.style.fill=selPoly.dataset.base;}
    var pol=document.getElementById(String(u.unidade).padStart(2,'0'));
    if(pol){pol.classList.add('sel');pol.style.fill=rgba(corUnidade(u),0.95);selPoly=pol;}
    document.getElementById('popTit').textContent='Unidade '+u.unidade+(u.decorado?' (Decorado)':'');
    document.getElementById('popVal').textContent=fmt(u.valorVenda);
    document.getElementById('popAval').textContent=fmt(u.avaliacao);
    document.getElementById('popInfo').textContent=u.informacoes||'';
    mostrarPlanta(document.getElementById('popImg'), u);
    var pop=document.getElementById('pop');
    var acoes=pop.querySelector('.acoes');
    var band=pop.querySelector('.band');
    var est=estadoUn(u);
    band.classList.toggle('vend', est==='VENDIDA');
    band.classList.toggle('res',  est==='RESERVADA');
    /* Ligada aqui no JS, sem depender da regra de CSS que exigia a classe
       .indisponivel. Reservada e vendida não entram nessa classe (elas ainda
       simulam), e era por isso que a faixa não aparecia nelas. */
    band.style.display = (est==='DISPONIVEL') ? 'none' : 'block';
    band.setAttribute('data-texto', est==='VENDIDA' ? 'VENDIDA!' :
                                    (est==='RESERVADA' ? 'RESERVADA!' : 'EM BREVE!'));
    document.getElementById('popSim').onclick=function(){simular(u.tipo,u.unidade);};
    document.getElementById('popProp').onclick=function(){proposta(u.tipo,u.unidade);};
    var avisoProp=document.getElementById('popAvisoProp');
    if(est==='DISPONIVEL'){
      pop.classList.remove('indisponivel'); acoes.style.display='flex';
      document.getElementById('popProp').disabled=false;
      document.getElementById('popProp').title='';
      avisoProp.style.display='none';
    }else if(est==='RESERVADA'){
      /* Item 14: reservada não aceita nova proposta, mas continua podendo
         simular — o corretor precisa do número mesmo sem a unidade livre. */
      pop.classList.remove('indisponivel'); acoes.style.display='flex';
      document.getElementById('popProp').disabled=true;
      document.getElementById('popProp').title='Unidade reservada — proposta bloqueada.';
      avisoProp.style.display='block';
      avisoProp.textContent='Unidade reservada. Dá para simular, mas não para enviar proposta.';
    }else{
      pop.classList.add('indisponivel'); acoes.style.display='none';
      avisoProp.style.display='none';
    }
    pop.style.display='block';
    var x=Math.min(evt.clientX+12, window.innerWidth-250);
    var y=Math.min(evt.clientY+12, window.innerHeight-240);
    pop.style.left=x+'px'; pop.style.top=Math.max(12,y)+'px';
  }
  function fecharPop(){document.getElementById('pop').style.display='none';if(selPoly){selPoly.classList.remove('sel');selPoly.style.fill=selPoly.dataset.base;selPoly=null;}}

  // ---- ligar cliques e hover (uma vez só) ----
  function ligarMapa(){
    for(var n=1;n<=62;n++){
      (function(n){
        var pol=document.getElementById(String(n).padStart(2,'0'));
        if(!pol)return;
        pol.addEventListener('click',function(e){
          var wrap=document.getElementById('mapScroll');
          if(wrap && wrap.dataset.arrastou) return;   // fim de arrasto, não seleção
          e.stopPropagation();var u=porNum(n);if(u)abrirPop(u,e);});
        pol.addEventListener('mouseenter',function(){if(pol!==selPoly&&pol.dataset.hover)pol.style.fill=pol.dataset.hover;});
        pol.addEventListener('mouseleave',function(){if(pol!==selPoly&&pol.dataset.base)pol.style.fill=pol.dataset.base;});
      })(n);
    }
  }
  document.addEventListener('click',function(e){var p=document.getElementById('pop');if(p.style.display==='block'&&!p.contains(e.target))fecharPop();});

  // ---- zoom e navegação (roda do mouse, arrastar, pinça no celular) ----
  // A largura do SVG é o que muda — assim o desenho continua vetorial e nítido
  // em qualquer nível, em vez de virar uma imagem esticada.
  var zLevel=1, ZMIN=0.5, ZMAX=6;
  function svgMapa(){ return document.querySelector('#mapScroll svg'); }

  /* Aplica o nível novo mantendo FIXO o ponto do mapa que está sob o cursor
     (ou sob o centro da tela). Sem isso, dar zoom joga a vista para o canto
     superior esquerdo e a pessoa se perde. */
  function aplicarZoom(novoNivel, ancoraX, ancoraY){
    var svg=svgMapa(), wrap=document.getElementById('mapScroll');
    if(!svg||!wrap) return;
    novoNivel=Math.max(ZMIN,Math.min(ZMAX,novoNivel));
    if(novoNivel===zLevel) return;

    var r=wrap.getBoundingClientRect();
    var px=(ancoraX==null? r.width/2  : ancoraX-r.left);
    var py=(ancoraY==null? r.height/2 : ancoraY-r.top);
    // posição relativa do ponto ancorado dentro do conteúdo, ANTES do zoom
    var fx=(wrap.scrollLeft+px)/svg.offsetWidth;
    var fy=(wrap.scrollTop +py)/svg.offsetHeight;

    var fator=novoNivel/zLevel; zLevel=novoNivel;
    svg.style.width=(zLevel*100)+'%';

    // depois do zoom, recoloca o mesmo ponto embaixo do cursor
    wrap.scrollLeft=fx*svg.offsetWidth-px;
    wrap.scrollTop =fy*svg.offsetHeight-py;
    if(fator){}  // (fator só documenta a intenção; a conta usa as frações)
  }
  function zoom(f){ aplicarZoom(zLevel*f, null, null); }

  function ligarNavegacao(){
    var wrap=document.getElementById('mapScroll');
    if(!wrap || wrap.dataset.nav) return;
    wrap.dataset.nav='1';

    // roda do mouse = zoom (Ctrl não é exigido: o mapa é o conteúdo da área)
    wrap.addEventListener('wheel', function(e){
      if(!svgMapa()) return;
      e.preventDefault();
      aplicarZoom(zLevel*(e.deltaY<0?1.15:0.87), e.clientX, e.clientY);
    }, {passive:false});

    // arrastar com o botão esquerdo = mover o mapa
    // IMPORTANTE: só chamamos setPointerCapture() depois de confirmar que é
    // um arrasto de verdade (passou do limiar de movimento). Capturar o
    // ponteiro já no pointerdown fazia o navegador redirecionar o "click"
    // seguinte para o próprio wrap em vez do polígono — por isso as
    // unidades pararam de abrir o pop-up depois que o arrasto foi ligado.
    var arrastando=false, capturado=false, x0=0, y0=0, sl=0, st=0, moveu=0;
    var LIMIAR_ARRASTO=6; // px — abaixo disso é clique; acima, é arrasto
    wrap.addEventListener('pointerdown', function(e){
      if(e.button!==0 || !svgMapa()) return;
      arrastando=true; capturado=false; moveu=0;
      x0=e.clientX; y0=e.clientY; sl=wrap.scrollLeft; st=wrap.scrollTop;
      wrap.style.cursor='grabbing';
    });
    wrap.addEventListener('pointermove', function(e){
      if(!arrastando) return;
      var dx=e.clientX-x0, dy=e.clientY-y0;
      moveu=Math.max(moveu, Math.abs(dx)+Math.abs(dy));
      // só captura o ponteiro quando o arrasto é confirmado — um clique
      // parado nunca chega a capturar, então o "click" nativo continua
      // sendo entregue ao polígono normalmente
      if(!capturado && moveu>LIMIAR_ARRASTO){
        capturado=true;
        try{ wrap.setPointerCapture(e.pointerId); }catch(err){}
      }
      wrap.scrollLeft=sl-dx; wrap.scrollTop=st-dy;
    });
    function soltar(e){
      if(!arrastando) return;
      arrastando=false; wrap.style.cursor='grab';
      if(capturado){ try{ wrap.releasePointerCapture(e.pointerId); }catch(err){} }
      capturado=false;
      /* Arrastou de verdade? Então o "click" que vem a seguir é fim de
         arrasto, não escolha de unidade — senão o pop-up abre sozinho
         toda vez que a pessoa move o mapa. */
      if(moveu>LIMIAR_ARRASTO){ wrap.dataset.arrastou='1'; setTimeout(function(){ delete wrap.dataset.arrastou; },0); }
    }
    wrap.addEventListener('pointerup', soltar);
    wrap.addEventListener('pointercancel', soltar);
    wrap.style.cursor='grab';

    // duplo clique aproxima
    wrap.addEventListener('dblclick', function(e){ aplicarZoom(zLevel*1.5, e.clientX, e.clientY); });
  }

  var svgPronto=false, unidadesProntas=false;
  var CAMINHOS_SVG=['assets/CONDOMINIO_VENDAS.svg','./assets/CONDOMINIO_VENDAS.svg','assets/CONDOMINIO_VENDAS.SVG'];
  function injetar(txt){
    var wrap=document.getElementById('mapScroll');
    wrap.innerHTML='';
    var caixa=document.createElement('div');
    caixa.innerHTML=txt;                       // SVG dentro de contexto HTML
    var el=caixa.querySelector('svg');
    if(!el) return false;
    el.removeAttribute('width'); el.removeAttribute('height');
    el.style.width='100%'; el.style.height='auto';
    wrap.appendChild(el);
    return true;
  }
  function usarTexto(txt){
    if(txt.indexOf('<svg')<0) return false;
    if(!injetar(txt)) return false;
    ligarMapa(); ligarNavegacao(); svgPronto=true; if(unidadesProntas) pintarMapa();
    return true;
  }
  function carregarSVG(i){
    i=i||0;
    if(i===0){
      try{ var cache=localStorage.getItem('svgMapa');
        if(cache && usarTexto(cache)) return;   // abre instantâneo
      }catch(e){}
    }
    if(i>=CAMINHOS_SVG.length){
      document.getElementById('mapScroll').innerHTML=
        '<div class="vazio">Não encontrei o arquivo do mapa em <b>assets/CONDOMINIO_VENDAS.svg</b>.'+
        ' Confirme se ele foi enviado para o GitHub nessa pasta.</div>';
      return;
    }
    fetch(CAMINHOS_SVG[i]).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.text();
    }).then(function(txt){
      if(!usarTexto(txt)) throw new Error('resposta não é SVG');
      try{ localStorage.setItem('svgMapa', txt); }catch(e){}
    }).catch(function(err){
      console.warn('mapa: falhou em '+CAMINHOS_SVG[i]+' ('+err.message+')');
      carregarSVG(i+1);
    });
  }

  // ===== dados das unidades: Notion ao vivo (Apps Script) -> unidades.json -> fallback =====
  var APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbzwUIApU5nKXi1vG3cEs_V2DWCdkLDwY_vo0zBxO59ZBLbEihIxuOqbHdNLm-8pVVwVJQ/exec';
  // 1) unidades.json do repositório = instantâneo (mesma origem, sem CORS)
  function buscarLocal(){
    return fetch('unidades.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():Promise.reject();});
  }
  // 2) Notion ao vivo = em segundo plano, só para pegar mudanças recentes
  function buscarAoVivo(){
    if(!(APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('http')===0)) return Promise.reject();
    return fetch(APPS_SCRIPT_URL+'?acao=unidades').then(function(r){return r.json();})
      .then(function(j){if(j&&j.ok&&j.unidades&&j.unidades.length)return j.unidades;throw 0;});
  }
  function buscarUnidades(){
    return buscarLocal().catch(function(){return buscarAoVivo();});
  }
  var ultimoHash='', dadosAoVivo=false;
  function aplicar(d, aoVivo){
    /* Uma vez que os dados AO VIVO chegaram, o retrato antigo (unidades.json
       ou cache) não pode mais sobrescrevê-los. Era isso que fazia a unidade
       reservada voltar a aparecer como disponível alguns segundos depois. */
    if(dadosAoVivo && !aoVivo) return;
    if(aoVivo) dadosAoVivo=true;
    var hash=JSON.stringify(d);
    if(aoVivo){ var ar=document.getElementById('avisoRetrato'); if(ar) ar.style.display='none'; }
    if(hash===ultimoHash && unidadesProntas){ tirarVeu(); return; }
    /* O cache do navegador saiu de cena: era ele que pintava o estado de
       ontem no F5, com o card "Decorado" sumindo e voltando. Se o servidor
       não responder, é melhor esperar do que mostrar informação velha. */
    ultimoHash=hash; UNIDADES=d;
    renderCards(); renderTabela();
    unidadesProntas=true; if(svgPronto) pintarMapa();
    tirarVeu();
  }
  /* Quando o que está na tela é o retrato do GitHub, diz isso — em vez de
     deixar a pessoa achar que aquilo é o estado de agora. */
  function avisarRetrato(){
    if(dadosAoVivo) return;
    var el=document.getElementById('avisoRetrato');
    if(el) el.style.display='block';
  }
  function tirarVeu(){
    var v=document.getElementById('veu');
    if(!v || v.classList.contains('sumindo')) return;
    v.classList.add('sumindo');
    document.querySelector('main').classList.remove('carregando');
    setTimeout(function(){ v.style.display='none'; }, 420);
  }
  function carregar(primeira){
    if(primeira){
      /* AO VIVO primeiro: é a única fonte que reflete o Notion agora.
         O unidades.json (republicado de 6 em 6 h) e o cache do navegador
         entram só se o Apps Script demorar mais de 3,5 s ou falhar — e
         ainda assim são substituídos assim que o ao vivo chega. */
      /* 12 s, não 3,5. O unidades.json é o retrato publicado pelo GitHub:
         se ele entrar antes do Notion ao vivo, a tela pinta o estado velho e
         se corrige segundos depois — que é o card piscando. O véu segura a
         tela nesse meio-tempo, e quando o retrato for mesmo usado aparece o
         aviso amarelo no rodapé. */
      var socorro=setTimeout(function(){
        if(dadosAoVivo) return;
        buscarLocal().then(function(d){ aplicar(d,false); avisarRetrato(); })
          .catch(function(){ if(!unidadesProntas){ aplicar(FALLBACK,false); avisarRetrato(); } });
      }, 12000);
      buscarAoVivo()
        .then(function(d){ clearTimeout(socorro); aplicar(d,true); })
        .catch(function(){
          clearTimeout(socorro);
          buscarLocal().then(function(d){ aplicar(d,false); })
            .catch(function(){ if(!unidadesProntas) aplicar(FALLBACK,false); });
        });
      // se nada responder, o véu não pode prender a página para sempre
      setTimeout(tirarVeu, 20000);
    }else{
      buscarAoVivo().then(function(d){aplicar(d,true);}).catch(function(){});
    }
  }
  function ocupado(){
    return document.getElementById('pop').style.display==='block'
        || document.getElementById('modal').style.display==='flex';
  }
  /* O cache NÃO é mais pintado de cara. Ele existe só para o caso de o
     Apps Script e o unidades.json falharem os dois — pintar antes era o que
     mostrava o estado antigo por um instante a cada F5. */
  document.querySelector('main').classList.add('carregando');
  carregarSVG();      // carrega o mapa já, sem esperar os dados
  carregar(true);     // dados em paralelo (atualiza o cache)
  // auto-atualiza a cada 60s (sem atrapalhar se um pop-up estiver aberto)
  setInterval(function(){ if(!ocupado()) carregar(false); }, 60000);

</script>
