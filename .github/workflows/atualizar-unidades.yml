name: Atualizar unidades (Notion -> unidades.json)
on:
  schedule:
    - cron: '0 */6 * * *'      # a cada 6h
  workflow_dispatch:            # botão manual
  repository_dispatch:          # disparado pelo portal ao editar uma unidade
    types: [unidades_update]
jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_UNIDADES: ${{ secrets.NOTION_DB_UNIDADES }}
        run: python fetch_notion.py
      - run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add unidades.json assets/plantas
          git commit -m "Atualiza unidades.json" || echo "sem mudanças"
          git push
